[search]
dense_model = "ollama/mahonzhan/all-MiniLM-L6-v2"
sparse_model = "Qdrant/bm25"
multi_model = "colbert-ir/colbertv2.0"
collection_name = "carp-docs"
qdrant_url = "http://localhost:6333"

[indexing]
points_path = "data/indexes/points.jsonl"
batch_size = 256

[query]
method = "hybrid"
rerank = true
limit = 10
prefetch_limit = 50

[[sources]]
name = "carp-docs-mintlify"
type = "mintlify"
path = "sources/carp-docs-mintlify"
enabled = true
blacklist = ["api-reference", "docs/development.mdx", "docs/index.mdx"]

[[sources]]
name = "carp-health-flutter"
type = "markdown"
path = "sources/carp-health-flutter"
enabled = true
whitelist = ["README.md"]
blacklist = ["CHANGELOG.md", "example/", "test/"]

[[sources]]
name = "carp-core-kotlin"
type = "markdown"
path = "sources/carp-core-kotlin"
enabled = true
whitelist = ["README.md", "docs/"]
blacklist = []

