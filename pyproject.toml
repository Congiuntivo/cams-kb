[project]
name = "kb"
version = "0.1.0"
description = "CARP knowledge base pipeline, built for retrieval"
requires-python = ">=3.12"
authors = [{ name = "Congiuntivo", email = "simonedecarli19@gmail.com" }]
dependencies = [
  "fastembed>=0.3.0",
  "langchain-text-splitters>=1.1.2",
  "litellm>=1.0.0",
  "orjson>=3.11.9",
  "pathspec>=1.1.1",
  "pydantic>=2.13.4",
  "qdrant-client>=1.13.0",
  "rich>=15.0.0",
  "typer>=0.25.1",
]

[project.scripts]
kb = "kb.cli.main:app"

[project.optional-dependencies]
dev = [
  "mypy>=2.1.0",
  "ruff>=0.15.12",
]

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
